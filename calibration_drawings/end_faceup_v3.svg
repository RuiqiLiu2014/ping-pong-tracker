    <text transform="rotate(12 525 344)" x="525" y="344" text-anchor="middle"
          fill="currentColor" stroke="none"
          font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
      <tspan x="525" dy="-10">forehand</tspan>
      <tspan x="525" dy="30">side</tspan>
    </text>

  </g>
