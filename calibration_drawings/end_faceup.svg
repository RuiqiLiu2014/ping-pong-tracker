<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Table: rectangular board seen from a corner, from above ===== -->
    <!-- top face: near corner B(430,470), right R(761,284), far F(544,162), left L(213,348) -->
    <!-- near-right (right) edge, broken where the handle crosses it -->
    <path d="M430 470 L574 389"/>
    <path d="M605 372 L761 284"/>
    <!-- other three top edges -->
    <path d="M761 284 L544 162"/>
    <path d="M544 162 L213 348"/>
    <path d="M213 348 L430 470"/>
    <!-- thickness: near vertical edges + bottom near edges -->
    <path d="M430 470 L430 496"/>
    <path d="M761 284 L761 310"/>
    <path d="M213 348 L213 374"/>
    <!-- bottom right edge, broken where the handle crosses it -->
    <path d="M430 496 L597 402"/>
    <path d="M628 385 L761 310"/>
    <!-- bottom left edge -->
    <path d="M430 496 L213 374"/>

    <!-- ===== Paddle: flat on the board, handle off the right side (bottom-right) ===== -->
    <g transform="matrix(0.8697,-0.4887,-0.8718,-0.4901,500,330)">
      <!-- handle: open U so no line crosses inside the face -->
      <path d="M-18 -74 L-18 -140 Q-18 -156 0 -156 Q18 -156 18 -140 L18 -74" stroke-width="3"/>
      <!-- face -->
      <ellipse cx="0" cy="0" rx="74" ry="74" stroke-width="3.5"/>
    </g>
    <!-- label -->
    <text transform="rotate(12 500 330)" x="500" y="330" text-anchor="middle"
          fill="currentColor" stroke="none"
          font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
      <tspan x="500" dy="-10">forehand</tspan>
      <tspan x="500" dy="30">side</tspan>
    </text>

  </g>
</svg>
