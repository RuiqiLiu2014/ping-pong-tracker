<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Board, stretched off the upper-left (open end) ===== -->
    <!-- right edge (near corner B -> right corner R) -->
    <path d="M430 470 L761 284"/>
    <!-- far edge, extended through F off the top -->
    <path d="M761 284 L256 0"/>
    <!-- near-left edge, extended through L off the left -->
    <path d="M430 470 L0 228"/>
    <!-- thickness: near verticals + bottom edges -->
    <path d="M430 470 L430 496"/>
    <path d="M761 284 L761 310"/>
    <!-- bottom-right edge, broken where the handle crosses it -->
    <path d="M430 496 L597 402"/>
    <path d="M628 385 L761 310"/>
    <!-- bottom-left edge, extended off the left -->
    <path d="M430 496 L0 254"/>

    <!-- ===== Paddle: flat on the board, handle fully off the right edge ===== -->
    <g transform="matrix(0.8697,-0.4887,-0.8718,-0.4901,525,344)">
      <path d="M-18 -74 L-18 -140 Q-18 -156 0 -156 Q18 -156 18 -140 L18 -74" stroke-width="3"/>
      <ellipse cx="0" cy="0" rx="74" ry="74" stroke-width="3.5"/>
    </g>
    <text transform="rotate(12 525 344)" x="525" y="344" text-anchor="middle"
          fill="currentColor" stroke="none"
          font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
      <tspan x="525" dy="-10">forehand</tspan>
      <tspan x="525" dy="30">side</tspan>
    </text>

  </g>
</svg>
