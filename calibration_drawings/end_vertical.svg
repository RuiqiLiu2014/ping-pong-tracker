<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640">
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Table: rectangular board seen from a corner, from above ===== -->
    <!-- top face: B(430,470) R(761,284) F(544,162) L(213,348); far edges stop behind the blade -->
    <path d="M430 470 L761 284"/>
    <path d="M761 284 L571 177"/>
    <path d="M213 348 L418 233"/>
    <path d="M213 348 L430 470"/>
    <!-- thickness -->
    <path d="M430 470 L430 496"/>
    <path d="M761 284 L761 310"/>
    <path d="M213 348 L213 374"/>
    <path d="M430 496 L761 310"/>
    <path d="M430 496 L213 374"/>

    <!-- ===== Paddle standing vertically on the board (handle down, forehand facing you) ===== -->
    <ellipse cx="0" cy="0" rx="24" ry="9"
             transform="matrix(0.8697,-0.4887,-0.8718,-0.4901,490,350)" stroke-width="1.5"/>
    <path d="M473 282 L473 340 Q473 350 483 350 L497 350 Q507 350 507 340 L507 282"
          stroke-width="3"/>
    <ellipse cx="490" cy="190" rx="82" ry="92" stroke-width="3.5"/>
    <!-- up arrow: tip points up -->
    <g stroke-width="2.5">
      <path d="M610 335 L610 240"/>
      <polyline points="598,262 610,238 622,262"/>
    </g>
    <!-- label -->
    <text x="490" y="190" text-anchor="middle" fill="currentColor" stroke="none"
          font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600">
      <tspan x="490" dy="-12">forehand</tspan>
      <tspan x="490" dy="32">side</tspan>
    </text>

  </g>
</svg>
